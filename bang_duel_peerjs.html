<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BANG! Duel — 1대1 프로토타입</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#171a20;--panel:#242a33;--panel2:#303845;--gold:#e8b85c;--red:#d85a50;--green:#68b58a;--muted:#aab3c0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#303947,#171a20 65%);color:#f3f1e9;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
main{max-width:1050px;margin:auto;padding:22px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;color:var(--gold);letter-spacing:2px;font-size:clamp(27px,5vw,42px)}.sub{color:var(--muted);font-size:13px}
.panel{background:rgba(36,42,51,.94);border:1px solid #414b59;border-radius:15px;padding:16px;margin:14px 0;box-shadow:0 8px 25px #0003}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1}
button,input{font:inherit;border-radius:9px;border:1px solid #596575;padding:10px 13px}button{background:#465366;color:white;cursor:pointer;font-weight:650}button:hover{filter:brightness(1.15)}button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--gold);color:#211b10;border-color:var(--gold)}button.danger{background:#8d3937}button.good{background:#286347}input{background:#171c23;color:white;min-width:150px}
.status{color:var(--muted);font-size:13px;margin-top:8px;min-height:18px}.hidden{display:none!important}
.arena{display:grid;grid-template-columns:1fr 1fr;gap:12px}.player{background:#1b2028;border:1px solid #424d5c;border-radius:12px;padding:14px;min-height:126px}.player.active{border:2px solid var(--gold);box-shadow:0 0 0 2px #e8b85c22}
.player h2{font-size:17px;margin:0 0 8px}.hearts{font-size:22px;letter-spacing:3px;color:#f07870}.meta{font-size:12px;color:var(--muted);margin-top:6px}
.section-title{font-size:14px;color:var(--gold);font-weight:750;margin-bottom:10px}
.hand{display:flex;flex-wrap:wrap;gap:9px}.card{width:130px;min-height:116px;text-align:left;background:linear-gradient(145deg,#f5ead0,#d9c9a8);color:#28251f;border:2px solid #fff8e9;border-radius:11px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 4px 8px #0004}
.card strong{font-size:16px}.card small{font-size:11px;line-height:1.3}.card .symbol{font-size:25px;align-self:flex-end}.card:disabled{opacity:.55;filter:grayscale(.7)}.card.selected{outline:3px solid var(--gold);transform:translateY(-3px);box-shadow:0 0 0 3px #e8b85c33}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.log{height:145px;overflow:auto;background:#151a20;border-radius:9px;padding:10px;font-size:13px;color:#cbd2dc}.log div{padding:3px 0;border-bottom:1px solid #ffffff0c}
.badge{display:inline-block;background:#3b4655;border-radius:20px;padding:4px 9px;font-size:12px;color:#dfe5ec}
footer{color:#8893a2;font-size:11px;text-align:center;margin:22px 0}
@media(max-width:600px){main{padding:13px}.arena{grid-template-columns:1fr}.card{width:calc(50% - 5px);min-height:105px}}
</style>
</head>
<body>
<main>
<header><div><h1>BANG! DUEL</h1><div class="sub">1대1 카드 대전 · 팬 제작 프로토타입</div></div><span class="badge" id="modeBadge">연결 대기</span></header>

<section class="panel" id="lobby">
 <div class="section-title">게임 시작</div>
 <div class="row">
  <button class="primary" id="aiBtn">AI와 대전</button>
  <button id="hostBtn">온라인 방 만들기</button>
  <input id="peerCode" placeholder="친구의 방 코드">
  <button id="joinBtn">방 참가</button>
 </div>
 <div class="status" id="netStatus">AI 대전 또는 온라인 대전을 선택하세요. 온라인은 두 사람 모두 이 페이지를 열어야 합니다.</div>
 <div class="row hidden" id="hostInfo"><span>내 방 코드:</span><strong id="myCode" style="color:var(--gold);letter-spacing:1px"></strong><button id="copyCode">코드 복사</button></div>
</section>

<section class="panel hidden" id="game">
 <div class="row" style="justify-content:space-between;margin-bottom:12px"><div class="section-title" style="margin:0">대전 현황</div><span class="badge" id="turnLabel">내 턴</span></div>
 <div class="arena">
  <div class="player" id="p1"><h2 id="name1">나</h2><div class="hearts" id="hp1">♥ ♥ ♥ ♥</div><div class="meta" id="meta1">손패 0장</div></div>
  <div class="player" id="p2"><h2 id="name2">상대</h2><div class="hearts" id="hp2">♥ ♥ ♥ ♥</div><div class="meta" id="meta2">손패 0장</div></div>
 </div>
 <div class="panel" style="background:#202630;margin:12px 0">
  <div class="row" style="justify-content:space-between"><div class="section-title" style="margin:0">내 손패</div><span class="badge" id="deckCount">덱 0장</span></div>
  <div class="hand" id="hand"></div>
  <div class="actions" id="actions"></div>
  <div class="status" id="hint"></div>
 </div>
 <div class="section-title">게임 기록</div><div class="log" id="log"></div>
 <div class="actions"><button class="danger" id="newGame">로비로 돌아가기</button></div>
</section>
<footer>이 버전은 원작 규칙을 그대로 재현한 것이 아닌, 1대1 테스트를 위한 간소화된 팬 프로토타입입니다. PeerJS 연결에는 인터넷이 필요합니다.</footer>
</main>
<script>
(() => {
const $ = id => document.getElementById(id);
const CARD = {
 bang:{name:"뱅!",symbol:"✦",desc:"상대에게 공격을 시도합니다.",color:"#b94d43"},
 miss:{name:"빗나감!",symbol:"〰",desc:"공격을 방어합니다.",color:"#477da4"},
 beer:{name:"맥주",symbol:"♥",desc:"체력을 1 회복합니다.",color:"#4d966c"},
 draw:{name:"전술!",symbol:"✚",desc:"카드 2장을 더 뽑습니다.",color:"#9a7ab4"}
};
let mode="none", peer=null, conn=null, isHost=false, localIndex=0, state=null, aiTimer=null;
let selectedDiscards=new Set();
const makeDeck=()=>{let d=[];for(let i=0;i<18;i++)d.push("bang");for(let i=0;i<12;i++)d.push("miss");for(let i=0;i<8;i++)d.push("beer");for(let i=0;i<6;i++)d.push("draw");return shuffle(d)};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function freshState(names=["나","상대"]){let s={players:[{name:names[0],hp:4,maxHp:4,hand:[]},{name:names[1],hp:4,maxHp:4,hand:[]}],deck:makeDeck(),discard:[],turn:0,bangs:0,pending:null,discarding:false,over:false,log:[]};for(let p of s.players)draw(s,p,4);draw(s,s.players[0],2);log(s,"대전 시작! "+names[0]+"의 턴입니다.");return s}
function log(s,t){s.log.unshift(t);s.log=s.log.slice(0,35)}
function draw(s,p,n){for(let i=0;i<n;i++){if(!s.deck.length){s.deck=shuffle(s.discard);s.discard=[];if(!s.deck.length)break}p.hand.push(s.deck.pop())}}
function discard(s,p,i){s.discard.push(p.hand.splice(i,1)[0])}
function endTurn(s){if(s.over)return;s.discarding=false;s.turn=1-s.turn;s.bangs=0;draw(s,s.players[s.turn],2);log(s,s.players[s.turn].name+"의 턴입니다. 카드 2장을 뽑았습니다.")}
function beginTurnEnd(s){const p=s.players[s.turn], excess=Math.max(0,p.hand.length-p.hp);if(excess>0){s.discarding=true;log(s,p.name+"의 턴 종료 단계: 체력("+p.hp+")만큼 남기도록 카드 "+excess+"장을 버려야 합니다.")}else endTurn(s)}
function hurt(s,target){s.players[target].hp--;log(s,s.players[target].name+"의 체력이 1 감소했습니다.");if(s.players[target].hp<=0){s.players[target].hp=0;s.over=true;log(s,s.players[1-target].name+" 승리!");}s.pending=null}
function processAction(actor,a){
 if(!state||state.over)return;
 if(actor!==state.turn && !(a.type==="defend"||a.type==="take"))return;
 const p=state.players[actor], target=1-actor;
 if(state.discarding){
  if(actor!==state.turn||a.type!=="discard"||!Array.isArray(a.indices))return;
  const need=Math.max(0,p.hand.length-p.hp);
  const indices=[...new Set(a.indices)].filter(i=>Number.isInteger(i)&&i>=0&&i<p.hand.length).sort((x,y)=>y-x);
  if(indices.length!==need)return;
  for(const i of indices)discard(state,p,i);
  log(state,p.name+"이(가) 체력에 맞춰 카드 "+indices.length+"장을 버렸습니다.");
  selectedDiscards.clear();endTurn(state);
 } else if(state.pending && (a.type==="defend"||a.type==="take")){
  if(actor!==state.pending.target)return;
  if(a.type==="defend"){let i=p.hand.indexOf("miss");if(i<0)return;discard(state,p,i);log(state,p.name+"이(가) 빗나감!으로 공격을 방어했습니다.");state.pending=null;}
  else hurt(state,actor);
 } else if(a.type==="play"){
  if(state.pending||state.turn!==actor)return;
  const i=a.index;if(!Number.isInteger(i)||i<0||i>=p.hand.length)return;
  const c=p.hand[i];
  if(c==="bang"){if(state.bangs>=1)return;discard(state,p,i);state.bangs++;state.pending={attacker:actor,target};log(state,p.name+"이(가) 뱅!을 사용했습니다.");}
  else if(c==="beer"){if(p.hp>=p.maxHp)return;discard(state,p,i);p.hp=Math.min(p.maxHp,p.hp+1);log(state,p.name+"이(가) 맥주로 체력을 회복했습니다.");}
  else if(c==="draw"){discard(state,p,i);draw(state,p,2);log(state,p.name+"이(가) 전술! 카드로 2장을 뽑았습니다.");}
  else return;
 } else if(a.type==="end"&&!state.pending){log(state,p.name+"의 턴 종료.");beginTurnEnd(state)}
 else return;
 if(mode==="online"&&isHost)broadcast();
 render();
 if(mode==="ai")maybeAI();
}
function guestView(){const copy=JSON.parse(JSON.stringify(state));if(copy)copy.players[0].hand=copy.players[0].hand.map(()=>"hidden");return copy}
function broadcast(){if(conn&&conn.open)conn.send({type:"state",state:guestView()});}
function render(){
 if(!state)return;$("lobby").classList.add("hidden");$("game").classList.remove("hidden");
 const me=state.players[localIndex],op=state.players[1-localIndex];
 $("name1").textContent=me.name;$("name2").textContent=op.name;
 $("hp1").textContent="♥ ".repeat(me.hp)+"♡ ".repeat(Math.max(0,me.maxHp-me.hp));$("hp2").textContent="♥ ".repeat(op.hp)+"♡ ".repeat(Math.max(0,op.maxHp-op.hp));
 $("meta1").textContent="손패 "+me.hand.length+"장";$("meta2").textContent="손패 "+op.hand.length+"장";
 $("p1").classList.toggle("active",state.turn===localIndex&&!state.over);$("p2").classList.toggle("active",state.turn!==localIndex&&!state.over);
 $("turnLabel").textContent=state.over?"게임 종료":state.discarding?(state.turn===localIndex?"턴 종료 · 카드 정리":"상대의 카드 정리"):state.pending?(state.pending.target===localIndex?"공격 방어 선택":"상대의 방어 대기"):state.turn===localIndex?"내 턴":"상대 턴";
 $("deckCount").textContent="덱 "+state.deck.length+"장";
 $("hand").innerHTML="";me.hand.forEach((c,i)=>{let b=document.createElement("button");b.className="card"+(selectedDiscards.has(i)?" selected":"");const discardMode=state.discarding&&state.turn===localIndex;b.disabled=state.over||(state.discarding?!discardMode:(state.pending||state.turn!==localIndex||c==="miss"||(c==="beer"&&me.hp>=me.maxHp)||(c==="bang"&&state.bangs>=1)));b.innerHTML=`<strong>${CARD[c].name}</strong><small>${discardMode?"눌러서 버릴 카드로 선택":CARD[c].desc}</small><span class="symbol">${CARD[c].symbol}</span>`;b.onclick=()=>{if(discardMode){if(selectedDiscards.has(i))selectedDiscards.delete(i);else selectedDiscards.add(i);render()}else sendAction({type:"play",index:i})};$("hand").appendChild(b)});
 const acts=$("actions");acts.innerHTML="";
 const add=(txt,fn,cls="",disabled=false)=>{let b=document.createElement("button");b.textContent=txt;b.className=cls;b.disabled=disabled;b.onclick=fn;acts.appendChild(b)};
 if(state.pending&&state.pending.target===localIndex&&!state.over){if(me.hand.includes("miss"))add("빗나감!으로 방어",()=>sendAction({type:"defend"}),"good");add("공격 받기",()=>sendAction({type:"take"}),"danger")}
 if(state.discarding&&state.turn===localIndex&&!state.over){const need=Math.max(0,me.hand.length-me.hp);add(`선택한 카드 버리기 (${selectedDiscards.size}/${need})`,()=>sendAction({type:"discard",indices:[...selectedDiscards]}),"primary",selectedDiscards.size!==need)}
 else if(!state.pending&&state.turn===localIndex&&!state.over)add("턴 종료",()=>sendAction({type:"end"}),"primary");
 $("hint").textContent=state.over?(state.players[localIndex].hp>0?"승리했습니다!":"패배했습니다."):state.discarding?(state.turn===localIndex?`손패를 체력(${me.hp})과 같은 장수로 맞추세요. ${Math.max(0,me.hand.length-me.hp)}장을 버려야 합니다.`:"상대가 턴 종료 후 손패를 정리하고 있습니다."):state.pending?(state.pending.target===localIndex?"공격을 방어하거나 받아들이세요.":"상대가 방어를 선택하고 있습니다."):state.turn===localIndex?"카드를 선택해 사용하거나 턴을 종료하세요.":"상대의 행동을 기다리는 중입니다.";
 $("log").innerHTML=state.log.map(x=>`<div>${escapeHtml(x)}</div>`).join("");
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function sendAction(a){if(mode==="online"&&!isHost){if(conn&&conn.open)conn.send({type:"action",action:a});if(a.type==="discard")selectedDiscards.clear();return}processAction(localIndex,a)}
function maybeAI(){
 if(mode!=="ai"||!state||state.over)return;
 clearTimeout(aiTimer);
 if(state.discarding&&state.turn===1){aiTimer=setTimeout(()=>{let p=state.players[1],need=Math.max(0,p.hand.length-p.hp),indices=shuffle(p.hand.map((_,i)=>i)).slice(0,need);processAction(1,{type:"discard",indices})},650);return;}
 if(state.pending&&state.pending.target===1){aiTimer=setTimeout(()=>{let p=state.players[1];let i=p.hand.indexOf("miss");processAction(1,{type:i>=0&&Math.random()<.75?"defend":"take"})},700);return}
 if(state.turn!==1)return;
 aiTimer=setTimeout(()=>{
  const p=state.players[1];let action=null;
  if(p.hp<=2&&p.hand.includes("beer"))action={type:"play",index:p.hand.indexOf("beer")};
  else if(state.bangs<1&&p.hand.includes("bang"))action={type:"play",index:p.hand.indexOf("bang")};
  else if(p.hand.includes("draw")&&Math.random()<.45)action={type:"play",index:p.hand.indexOf("draw")};
  if(action)processAction(1,action);else processAction(1,{type:"end"});
 },850);
}
function startAI(){mode="ai";localIndex=0;isHost=false;state=freshState(["나","AI"]);$("modeBadge").textContent="AI 대전";$("netStatus").textContent="AI 대전 중";render()}
function cleanup(){clearTimeout(aiTimer);if(conn){try{conn.close()}catch(e){}conn=null}if(peer){try{peer.destroy()}catch(e){}peer=null}state=null;selectedDiscards.clear();mode="none";$("game").classList.add("hidden");$("lobby").classList.remove("hidden");$("hostInfo").classList.add("hidden");$("modeBadge").textContent="연결 대기"}
$("aiBtn").onclick=startAI;
$("newGame").onclick=cleanup;
$("hostBtn").onclick=()=>{
 cleanup();mode="online";isHost=true;localIndex=0;
 if(!window.Peer){$("netStatus").textContent="PeerJS를 불러오지 못했습니다. 인터넷 연결을 확인하세요.";return}
 $("netStatus").textContent="방을 만드는 중...";
 peer=new Peer(undefined,{debug:1});
 peer.on("open",id=>{$("myCode").textContent=id;$("hostInfo").classList.remove("hidden");$("netStatus").textContent="친구에게 방 코드를 보내세요. 친구가 접속하면 대전이 시작됩니다.";});
 peer.on("connection",c=>{if(conn){c.close();return}conn=c;conn.on("open",()=>{state=freshState(["나","친구"]);$("netStatus").textContent="친구와 연결되었습니다!";$("modeBadge").textContent="온라인 대전";conn.send({type:"welcome",state:guestView()});render();});conn.on("data",m=>{if(m.type==="action")processAction(1,m.action)});conn.on("close",()=>$("netStatus").textContent="상대와 연결이 끊겼습니다.");});
 peer.on("error",e=>$("netStatus").textContent="연결 오류: "+e.type);
};
$("joinBtn").onclick=()=>{
 const code=$("peerCode").value.trim();if(!code){$("netStatus").textContent="방 코드를 입력하세요.";return}
 cleanup();mode="online";isHost=false;localIndex=1;
 if(!window.Peer){$("netStatus").textContent="PeerJS를 불러오지 못했습니다.";return}
 $("netStatus").textContent="방에 연결하는 중...";
 peer=new Peer(undefined,{debug:1});peer.on("open",()=>{conn=peer.connect(code,{reliable:true});conn.on("open",()=>{$("netStatus").textContent="방에 연결되었습니다. 게임 정보를 기다리는 중...";});conn.on("data",m=>{if(m.type==="welcome"){state=m.state;$("modeBadge").textContent="온라인 대전";render()}else if(m.type==="state"){state=m.state;render()}});conn.on("close",()=>$("netStatus").textContent="호스트와 연결이 끊겼습니다.");});peer.on("error",e=>$("netStatus").textContent="연결 오류: "+e.type);
};
$("copyCode").onclick=()=>{navigator.clipboard?.writeText($("myCode").textContent).then(()=>$("netStatus").textContent="방 코드를 복사했습니다.").catch(()=>$("netStatus").textContent="코드를 직접 복사해 주세요.")};
})();
</script>
</body>
</html>

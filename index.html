<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BANG! Duel — 1대1 프로토타입</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#171a20;--panel:#242a33;--panel2:#303845;--gold:#e8b85c;--red:#d85a50;--green:#68b58a;--muted:#aab3c0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#303947,#171a20 65%);color:#f3f1e9;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
main{max-width:1050px;margin:auto;padding:22px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;color:var(--gold);letter-spacing:2px;font-size:clamp(27px,5vw,42px)}.sub{color:var(--muted);font-size:13px}
.panel{background:rgba(36,42,51,.94);border:1px solid #414b59;border-radius:15px;padding:16px;margin:14px 0;box-shadow:0 8px 25px #0003}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1}
button,input{font:inherit;border-radius:9px;border:1px solid #596575;padding:10px 13px}button{background:#465366;color:white;cursor:pointer;font-weight:650}button:hover{filter:brightness(1.15)}button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--gold);color:#211b10;border-color:var(--gold)}button.danger{background:#8d3937}button.good{background:#286347}input{background:#171c23;color:white;min-width:150px}
.status{color:var(--muted);font-size:13px;margin-top:8px;min-height:18px}.hidden{display:none!important}
.arena{display:grid;grid-template-columns:1fr 1fr;gap:12px}.player{background:#1b2028;border:1px solid #424d5c;border-radius:12px;padding:14px;min-height:126px}.player.active{border:2px solid var(--gold);box-shadow:0 0 0 2px #e8b85c22}
.player h2{font-size:17px;margin:0 0 8px}.hearts{font-size:22px;letter-spacing:3px;color:#f07870}.meta{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.section-title{font-size:14px;color:var(--gold);font-weight:750;margin-bottom:10px}
.hand{display:flex;flex-wrap:wrap;gap:9px}.card{width:130px;min-height:116px;text-align:left;background:linear-gradient(145deg,#f5ead0,#d9c9a8);color:#28251f;border:2px solid #fff8e9;border-radius:11px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 4px 8px #0004}
.card strong{font-size:16px}.card small{font-size:11px;line-height:1.3}.card .symbol{font-size:25px;align-self:flex-end}.card:disabled{opacity:.55;filter:grayscale(.7)}.card.selected{outline:3px solid var(--gold);transform:translateY(-3px);box-shadow:0 0 0 3px #e8b85c33}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.log{height:145px;overflow:auto;background:#151a20;border-radius:9px;padding:10px;font-size:13px;color:#cbd2dc}.log div{padding:3px 0;border-bottom:1px solid #ffffff0c}
.badge{display:inline-block;background:#3b4655;border-radius:20px;padding:4px 9px;font-size:12px;color:#dfe5ec}
footer{color:#8893a2;font-size:11px;text-align:center;margin:22px 0}
@media(max-width:600px){main{padding:13px}.arena{grid-template-columns:1fr}.card{width:calc(50% - 5px);min-height:105px}}
</style>
</head>
<body>
<main>
<header><div><h1>BANG! DUEL</h1><div class="sub">1대1 카드 대전 · 팬 제작 프로토타입</div></div><span class="badge" id="modeBadge">연결 대기</span></header>

<section class="panel" id="lobby">
 <div class="section-title">게임 시작</div>
 <div class="row">
  <button class="primary" id="aiBtn">AI와 대전</button>
  <button id="hostBtn">온라인 방 만들기</button>
  <input id="peerCode" placeholder="친구의 방 코드">
  <button id="joinBtn">방 참가</button>
 </div>
 <div class="status" id="netStatus">AI 대전 또는 온라인 대전을 선택하세요. 온라인은 두 사람 모두 이 페이지를 열어야 합니다.</div>
 <div class="row hidden" id="hostInfo"><span>내 방 코드:</span><strong id="myCode" style="color:var(--gold);letter-spacing:1px"></strong><button id="copyCode">코드 복사</button></div>
</section>

<section class="panel hidden" id="game">
 <div class="row" style="justify-content:space-between;margin-bottom:12px"><div class="section-title" style="margin:0">대전 현황</div><span class="badge" id="turnLabel">내 턴</span></div>
 <div class="arena">
  <div class="player" id="p1"><h2 id="name1">나</h2><div class="hearts" id="hp1">♥ ♥ ♥ ♥</div><div class="meta" id="meta1">손패 0장</div></div>
  <div class="player" id="p2"><h2 id="name2">상대</h2><div class="hearts" id="hp2">♥ ♥ ♥ ♥</div><div class="meta" id="meta2">손패 0장</div></div>
 </div>
 <div class="panel" style="background:#202630;margin:12px 0">
  <div class="row" style="justify-content:space-between"><div class="section-title" style="margin:0">내 손패</div><span class="badge" id="deckCount">덱 0장</span></div>
  <div class="hand" id="hand"></div>
  <div class="actions" id="actions"></div>
  <div class="status" id="hint"></div>
 </div>
 <div class="section-title">게임 기록</div><div class="log" id="log"></div>
 <div class="actions"><button class="danger" id="newGame">로비로 돌아가기</button></div>
</section>
<footer>이 버전은 원작 규칙을 그대로 재현한 것이 아닌, 1대1 테스트를 위한 간소화된 팬 프로토타입입니다. PeerJS 연결에는 인터넷이 필요합니다.</footer>
</main>
<script>
(() => {
const $=id=>document.getElementById(id);
const SUITS=["♥","♦","♣","♠"];
const CARD={bang:{name:"뱅!",symbol:"✦",desc:"상대 공격 · 턴당 1회"},miss:{name:"빗나감!",symbol:"〰",desc:"뱅!을 방어"},beer:{name:"맥주",symbol:"♥",desc:"내 체력 1 회복"},draw:{name:"전략",symbol:"✚",desc:"카드 2장 드로우"},repair:{name:"정비",symbol:"⚙",desc:"카드 3장 드로우"},duel:{name:"결투",symbol:"⚔",desc:"상대와 뱅!을 번갈아 냄"},indians:{name:"인디언",symbol:"🏹",desc:"상대가 뱅!을 내지 못하면 피해 1"},saloon:{name:"선술",symbol:"🍺",desc:"나 2 회복 · 상대 1 회복"},cat:{name:"캣벌로우",symbol:"🐈",desc:"상대 손패 또는 장비 1장 버리기"},steal:{name:"강탈",symbol:"✋",desc:"상대 손패 또는 장비 1장 가져오기"},barrel:{name:"술통",symbol:"🛢",desc:"뱅!을 맞으면 하트 판정으로 회피"},vest:{name:"방탄조끼",symbol:"🦺",desc:"상대 턴 첫 뱅! 방어 · 내구도 3"},scope:{name:"정조준",symbol:"◎",desc:"뱅!에 카드 1장을 더 버려 장비 무시"},jail:{name:"감옥",symbol:"🔒",desc:"상대 턴 시작 때 하트가 아니면 턴 건너뜀 · 내구도 3"},dynamite:{name:"다이너마이트",symbol:"💣",desc:"턴 시작 때 스페이드면 피해 2, 아니면 전달"}};
let mode="none",peer=null,conn=null,isHost=false,localIndex=0,state=null,aiTimer=null,selectedDiscards=new Set(),aimedMode=false;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function card(id){return {id,suit:SUITS[Math.floor(Math.random()*4)],uid:Math.random().toString(36).slice(2)}}
function makeDeck(){let counts={bang:22,miss:16,beer:8,draw:7,repair:5,duel:5,indians:5,saloon:4,cat:6,steal:5,barrel:3,vest:3,scope:3,jail:3,dynamite:2};let d=[];for(let [id,n] of Object.entries(counts))for(let i=0;i<n;i++)d.push(card(id));return shuffle(d)}
function freshState(names=["나","상대"]){let s={players:[0,1].map(i=>({name:names[i],hp:4,maxHp:4,hand:[],equip:[],attached:[]})),deck:makeDeck(),discard:[],turn:0,turnNo:0,bangs:0,pending:null,discarding:false,over:false,log:[],skipStart:false};for(let p of s.players)draw(s,p,4);draw(s,s.players[0],2);log(s,"대전 시작! "+names[0]+"의 턴입니다.");return s}
function log(s,t){s.log.unshift(t);s.log=s.log.slice(0,45)}
function draw(s,p,n){for(let i=0;i<n;i++){if(!s.deck.length){s.deck=shuffle(s.discard);s.discard=[];if(!s.deck.length)break}p.hand.push(s.deck.pop())}}
function discard(s,p,i){let c=p.hand.splice(i,1)[0];if(c)s.discard.push(c);return c}
function discardEquip(s,p,i){let c=p.equip.splice(i,1)[0];if(c)s.discard.push(c);return c}
function judgment(s){if(!s.deck.length){s.deck=shuffle(s.discard);s.discard=[]}return s.deck.pop()||card("miss")}
function suitName(c){return c.suit}
function damage(s,target,n=1){let p=s.players[target];p.hp=Math.max(0,p.hp-n);log(s,p.name+" 피해 "+n+"을(를) 받았습니다.");if(p.hp<=0){s.over=true;log(s,s.players[1-target].name+" 승리!")} }
function equipIndex(p,id){return p.equip.findIndex(c=>c.id===id)}
function equipmentLabel(c){return CARD[c.id].name+(c.id==="vest"||c.id==="jail"?" (내구도 "+(c.durability??3)+")":"")}
function startTurn(s){if(s.over)return;let p=s.players[s.turn],op=s.players[1-s.turn];s.bangs=0;s.skipStart=false;
 // attached dynamite resolves first
 let di=op.attached.findIndex(c=>c.id==="dynamite"); // attachment on current player is p, not op
 di=p.attached.findIndex(c=>c.id==="dynamite");
 if(di>=0){let d=p.attached[di],j=judgment(s);log(s,p.name+"의 다이너마이트 판정: "+j.suit);if(j.suit==="♠"){p.attached.splice(di,1);s.discard.push(d);s.discard.push(j);damage(s,s.turn,2);if(s.over)return;}else{p.attached.splice(di,1);op.attached.push(d);s.discard.push(j);log(s,"다이너마이트가 "+op.name+"에게 넘어갔습니다.")}}
 // jail attached
 let ji=p.attached.findIndex(c=>c.id==="jail");if(ji>=0){let jcard=p.attached[ji],j=judgment(s);log(s,p.name+"의 감옥 판정: "+j.suit);s.discard.push(j);if(j.suit==="♥"){p.attached.splice(ji,1);s.discard.push(jcard);log(s,"감옥에서 탈출했습니다.")}else{jcard.durability=(jcard.durability??3)-1;log(s,"감옥 효과로 턴을 건너뜁니다. 내구도 "+jcard.durability);if(jcard.durability<=0){p.attached.splice(ji,1);s.discard.push(jcard);log(s,"감옥이 파괴되었습니다.")}s.skipStart=true;}}
 if(s.skipStart){endTurn(s);return}
 draw(s,p,2);log(s,p.name+"의 턴입니다. 카드 2장을 뽑았습니다.")
}
function endTurn(s){if(s.over)return;s.discarding=false;s.turn=1-s.turn;s.turnNo++;s.bangs=0;startTurn(s)}
function beginTurnEnd(s){const p=s.players[s.turn],excess=Math.max(0,p.hand.length-p.hp);if(excess>0){s.discarding=true;log(s,p.name+"은(는) 체력에 맞춰 "+excess+"장을 버려야 합니다.")}else endTurn(s)}
function randomSteal(s,actor,kind){let p=s.players[actor],t=s.players[1-actor];if(kind==="hand"&&t.hand.length){let i=Math.floor(Math.random()*t.hand.length);let c=t.hand.splice(i,1)[0];if(c)p.hand.push(c);log(s,p.name+"이(가) 상대 손패 1장을 가져왔습니다.")}else if(kind==="equip"&&t.equip.length){let i=Math.floor(Math.random()*t.equip.length);let c=t.equip.splice(i,1)[0];p.equip.push(c);log(s,p.name+"이(가) 상대 장비 "+CARD[c.id].name+"을(를) 가져왔습니다.")}}
function randomDestroy(s,actor,kind){let t=s.players[1-actor];if(kind==="hand"&&t.hand.length){let i=Math.floor(Math.random()*t.hand.length);let c=t.hand.splice(i,1)[0];s.discard.push(c);log(s,t.name+"의 손패 1장이 버려졌습니다.")}else if(kind==="equip"&&t.equip.length){let i=Math.floor(Math.random()*t.equip.length);let c=t.equip.splice(i,1)[0];s.discard.push(c);log(s,t.name+"의 장비 "+CARD[c.id].name+"이(가) 버려졌습니다.")}}
function beginBang(s,actor,cardObj,ignoreEquip=false){let target=1-actor,t=s.players[target];let pending={kind:"bang",attacker:actor,target,ignoreEquip};
 if(!ignoreEquip&&equipIndex(t,"barrel")>=0){let j=judgment(s);log(s,t.name+"의 술통 판정: "+j.suit);s.discard.push(j);if(j.suit==="♥"){log(s,"술통이 뱅!을 회피했습니다.");return}}
 if(!ignoreEquip){let vi=equipIndex(t,"vest");if(vi>=0&&(t.equip[vi].usedTurn!==s.turnNo)&&t.hand.length){let v=t.equip[vi],i=Math.floor(Math.random()*t.hand.length);discard(s,t,i);v.durability=(v.durability??3)-1;v.usedTurn=s.turnNo;log(s,"방탄조끼가 뱅!을 막고 손패 1장을 버렸습니다. 내구도 "+v.durability);if(v.durability<=0){discardEquip(s,t,vi);log(s,"방탄조끼가 파괴되었습니다.")}return}}
 s.pending=pending;log(s,s.players[actor].name+"의 뱅!에 대응해야 합니다.")
}
function processAction(actor,a){if(!state||state.over)return;const p=state.players[actor],target=1-actor;
 if(state.discarding){if(actor!==state.turn||a.type!=="discard"||!Array.isArray(a.indices))return;let need=Math.max(0,p.hand.length-p.hp),idx=[...new Set(a.indices)].filter(i=>Number.isInteger(i)&&i>=0&&i<p.hand.length).sort((x,y)=>y-x);if(idx.length!==need)return;idx.forEach(i=>discard(state,p,i));selectedDiscards.clear();log(state,p.name+"이(가) 손패를 정리했습니다.");endTurn(state)}
 else if(state.pending){let q=state.pending;if(a.type==="defend"&&actor===q.target){let i=p.hand.findIndex(c=>c.id==="miss");if(i<0)return;discard(state,p,i);log(state,p.name+"이(가) 빗나감!으로 방어했습니다.");state.pending=null}
 else if(a.type==="take"&&actor===q.target){damage(state,actor,1);state.pending=null}
 else if(a.type==="duelBang"&&actor===q.target&&q.kind==="duel"){let i=p.hand.findIndex(c=>c.id==="bang");if(i<0)return;discard(state,p,i);log(state,p.name+"이(가) 결투에서 뱅!을 냈습니다.");state.pending={kind:"duel",attacker:actor,target:q.attacker}}
 else if(a.type==="duelFail"&&actor===q.target&&q.kind==="duel"){damage(state,actor,1);state.pending=null}
 else if(a.type==="indianBang"&&actor===q.target&&q.kind==="indians"){let i=p.hand.findIndex(c=>c.id==="bang");if(i<0)return;discard(state,p,i);log(state,p.name+"이(가) 인디언 공격을 뱅!으로 막았습니다.");state.pending=null}
 else if(a.type==="indianFail"&&actor===q.target&&q.kind==="indians"){damage(state,actor,1);state.pending=null}
 else if(a.type==="choose"&&actor===q.attacker&&(q.kind==="cat"||q.kind==="steal")){let kind=a.kind,t=state.players[q.target];if((kind!=="hand"&&kind!=="equip")||(kind==="hand"&&!t.hand.length)||(kind==="equip"&&!t.equip.length))return;if(q.kind==="cat")randomDestroy(state,actor,kind);else randomSteal(state,actor,kind);state.pending=null}
 else return;
 }
 else if(a.type==="play"&&actor===state.turn){let i=a.index;if(!Number.isInteger(i)||i<0||i>=p.hand.length)return;let c=p.hand[i],id=c.id,t=state.players[target];
  if(id==="bang"){if(state.bangs>=1)return;discard(state,p,i);state.bangs++;beginBang(state,actor,c,false)}
  else if(id==="beer"){if(p.hp>=p.maxHp)return;discard(state,p,i);p.hp=Math.min(p.maxHp,p.hp+1);log(state,p.name+"이(가) 맥주로 체력 1을 회복했습니다.")}
  else if(id==="draw"||id==="repair"){discard(state,p,i);let n=id==="draw"?2:3;draw(state,p,n);log(state,p.name+"이(가) "+CARD[id].name+"으로 "+n+"장 뽑았습니다.")}
  else if(id==="saloon"){discard(state,p,i);p.hp=Math.min(p.maxHp,p.hp+2);t.hp=Math.min(t.maxHp,t.hp+1);log(state,"선술 효과: 나 2, 상대 1 회복")}
  else if(id==="duel"){discard(state,p,i);state.pending={kind:"duel",attacker:actor,target};log(state,p.name+"이(가) 결투를 신청했습니다. 상대부터 뱅!을 내세요.")}
  else if(id==="indians"){discard(state,p,i);state.pending={kind:"indians",attacker:actor,target};log(state,p.name+"이(가) 인디언을 사용했습니다.")}
  else if(id==="cat"||id==="steal"){if(!t.hand.length&&!t.equip.length)return;discard(state,p,i);state.pending={kind:id,attacker:actor,target};log(state,p.name+"이(가) "+CARD[id].name+" 사용: 상대의 손패 또는 장비를 선택하세요.")}
  else if(id==="barrel"||id==="vest"||id==="scope"){if(equipIndex(p,id)>=0)return;discard(state,p,i);c.durability=id==="vest"?3:undefined;p.equip.push(c);log(state,p.name+"이(가) "+CARD[id].name+"을(를) 장착했습니다.")}
  else if(id==="jail"||id==="dynamite"){discard(state,p,i);c.durability=id==="jail"?3:undefined;t.attached.push(c);log(state,p.name+"이(가) 상대에게 "+CARD[id].name+"을(를) 부착했습니다.")}
  else return;
 }
 else if(a.type==="scopeBang"&&actor===state.turn){let bi=p.hand.findIndex(c=>c.id==="bang"),si=a.index;if(bi<0||equipIndex(p,"scope")<0||state.bangs>=1||!Number.isInteger(si)||si<0||si>=p.hand.length||si===bi)return;discard(state,p,Math.max(bi,si));discard(state,p,Math.min(bi,si));state.bangs++;beginBang(state,actor,null,true);log(state,"정조준! 손패 1장을 추가로 버리고 장비를 무시했습니다.")}

 else if(a.type==="end"&&actor===state.turn&&!state.pending){log(state,p.name+"의 턴 종료.");beginTurnEnd(state)}else return;
 if(mode==="online"&&isHost)broadcast();render();if(mode==="ai")maybeAI();
}
function guestView(){let copy=JSON.parse(JSON.stringify(state));if(copy)copy.players[0].hand=copy.players[0].hand.map(()=>({id:"hidden",suit:"",uid:""}));return copy}
function broadcast(){if(conn&&conn.open)conn.send({type:"state",state:guestView()})}
function render(){if(!state)return;$("lobby").classList.add("hidden");$("game").classList.remove("hidden");let me=state.players[localIndex],op=state.players[1-localIndex];$("name1").textContent=me.name;$("name2").textContent=op.name;$("hp1").textContent="♥ ".repeat(me.hp)+"♡ ".repeat(Math.max(0,me.maxHp-me.hp));$("hp2").textContent="♥ ".repeat(op.hp)+"♡ ".repeat(Math.max(0,op.maxHp-op.hp));$("meta1").textContent="손패 "+me.hand.length+"장 · 장비: "+(me.equip.map(equipmentLabel).join(", ")||"없음")+" · 부착: "+(me.attached.map(c=>CARD[c.id].name).join(", ")||"없음");$("meta2").textContent="손패 "+op.hand.length+"장 · 장비: "+(op.equip.map(equipmentLabel).join(", ")||"없음")+" · 부착: "+(op.attached.map(c=>CARD[c.id].name).join(", ")||"없음");$("p1").classList.toggle("active",state.turn===localIndex&&!state.over);$("p2").classList.toggle("active",state.turn!==localIndex&&!state.over);let q=state.pending;$("turnLabel").textContent=state.over?"게임 종료":state.discarding?(state.turn===localIndex?"턴 종료 · 카드 정리":"상대 카드 정리"):q?(q.target===localIndex?"대응 선택":"상대 대응 대기"):state.turn===localIndex?"내 턴":"상대 턴";$("deckCount").textContent="덱 "+state.deck.length+"장";
 $("hand").innerHTML="";me.hand.forEach((c,i)=>{let b=document.createElement("button");b.className="card"+(selectedDiscards.has(i)?" selected":"");let discardMode=state.discarding&&state.turn===localIndex,disabled=state.over||(state.discarding?!discardMode:(state.pending||state.turn!==localIndex||c.id==="miss"||(c.id==="beer"&&me.hp>=me.maxHp)||(c.id==="bang"&&state.bangs>=1)));b.disabled=disabled;b.innerHTML=`<strong>${CARD[c.id]?.name||"비공개"}</strong><small>${discardMode?"눌러서 버릴 카드로 선택":(CARD[c.id]?.desc||"")}</small><span class="symbol">${c.suit||""} ${CARD[c.id]?.symbol||""}</span>`;b.onclick=()=>{if(discardMode){selectedDiscards.has(i)?selectedDiscards.delete(i):selectedDiscards.add(i);render()}else if(aimedMode&&equipIndex(me,"scope")>=0&&me.hand.some(x=>x.id==="bang")&&c.id!=="bang"){aimedMode=false;sendAction({type:"scopeBang",index:i})}else sendAction({type:"play",index:i})};$("hand").appendChild(b)});
 const acts=$("actions");acts.innerHTML="";const add=(txt,fn,cls="",disabled=false)=>{let b=document.createElement("button");b.textContent=txt;b.className=cls;b.disabled=disabled;b.onclick=fn;acts.appendChild(b)};
 if(q&&q.target===localIndex&&!state.over){if(q.kind==="bang"){if(me.hand.some(c=>c.id==="miss"))add("빗나감!으로 방어",()=>sendAction({type:"defend"}),"good");add("공격 받기",()=>sendAction({type:"take"}),"danger")}else if(q.kind==="duel"){if(me.hand.some(c=>c.id==="bang"))add("뱅! 내기",()=>sendAction({type:"duelBang"}),"good");add("결투 포기 · 피해 1",()=>sendAction({type:"duelFail"}),"danger")}else if(q.kind==="indians"){if(me.hand.some(c=>c.id==="bang"))add("뱅!으로 막기",()=>sendAction({type:"indianBang"}),"good");add("막지 못함 · 피해 1",()=>sendAction({type:"indianFail"}),"danger")}}
 if(q&&q.attacker===localIndex&&(q.kind==="cat"||q.kind==="steal")){add("상대 손패 무작위 "+(q.kind==="cat"?"버리기":"가져오기"),()=>sendAction({type:"choose",kind:"hand"}),"primary",!op.hand.length);add("상대 장비 "+(q.kind==="cat"?"버리기":"가져오기"),()=>sendAction({type:"choose",kind:"equip"}),"primary",!op.equip.length)}
 if(state.discarding&&state.turn===localIndex&&!state.over){let need=Math.max(0,me.hand.length-me.hp);add(`선택한 카드 버리기 (${selectedDiscards.size}/${need})`,()=>sendAction({type:"discard",indices:[...selectedDiscards]}),"primary",selectedDiscards.size!==need)}else if(!q&&state.turn===localIndex&&!state.over){if(equipIndex(me,"scope")>=0&&me.hand.some(c=>c.id==="bang"))add(aimedMode?"정조준 취소":"정조준 사용 · 버릴 카드 선택",()=>{aimedMode=!aimedMode;render()},aimedMode?"danger":"good");add("턴 종료",()=>{aimedMode=false;sendAction({type:"end"})},"primary")}
 $("hint").textContent=state.over?(me.hp>0?"승리했습니다!":"패배했습니다."):state.discarding?(state.turn===localIndex?`손패를 체력(${me.hp})과 같은 장수로 맞추세요.`:"상대가 손패를 정리하고 있습니다."):q?(q.target===localIndex?"상대 카드에 대응하세요.":"상대의 대응을 기다리는 중입니다."):aimedMode?"정조준에 사용할 뱅! 이외의 손패 1장을 선택하세요.":state.turn===localIndex?"카드를 선택해 사용하거나 턴을 종료하세요.":"상대의 행동을 기다리는 중입니다.";$("log").innerHTML=state.log.map(x=>`<div>${escapeHtml(x)}</div>`).join("")}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function sendAction(a){if(mode==="online"&&!isHost){if(conn&&conn.open)conn.send({type:"action",action:a});if(a.type==="discard")selectedDiscards.clear();return}processAction(localIndex,a)}
function maybeAI(){if(mode!=="ai"||!state||state.over)return;clearTimeout(aiTimer);let q=state.pending;if(q&&q.target===1){aiTimer=setTimeout(()=>{let p=state.players[1],a;if(q.kind==="bang")a=p.hand.some(c=>c.id==="miss")&&Math.random()<.8?{type:"defend"}:{type:"take"};else if(q.kind==="duel")a=p.hand.some(c=>c.id==="bang")&&Math.random()<.7?{type:"duelBang"}:{type:"duelFail"};else if(q.kind==="indians")a=p.hand.some(c=>c.id==="bang")?{type:"indianBang"}:{type:"indianFail"};else a={type:"choose",kind:p.hand.length?"hand":"equip"};processAction(1,a)},650);return}if(state.discarding&&state.turn===1){aiTimer=setTimeout(()=>{let p=state.players[1],need=Math.max(0,p.hand.length-p.hp);processAction(1,{type:"discard",indices:shuffle(p.hand.map((_,i)=>i)).slice(0,need)})},500);return}if(state.turn!==1)return;aiTimer=setTimeout(()=>{let p=state.players[1],a=null;if(p.hp<=2&&p.hand.some(c=>c.id==="beer"))a={type:"play",index:p.hand.findIndex(c=>c.id==="beer")};else if(state.bangs<1&&p.hand.some(c=>c.id==="bang"))a={type:"play",index:p.hand.findIndex(c=>c.id==="bang")};else if(p.hand.some(c=>["repair","draw","saloon"].includes(c.id)))a={type:"play",index:p.hand.findIndex(c=>["repair","draw","saloon"].includes(c.id))};else a={type:"end"};processAction(1,a)},700)}
function startAI(){mode="ai";localIndex=0;isHost=false;state=freshState(["나","AI"]);$("modeBadge").textContent="AI 대전";$("netStatus").textContent="AI 대전 중";render()}
function cleanup(){clearTimeout(aiTimer);if(conn){try{conn.close()}catch(e){}conn=null}if(peer){try{peer.destroy()}catch(e){}peer=null}state=null;selectedDiscards.clear();aimedMode=false;mode="none";$("game").classList.add("hidden");$("lobby").classList.remove("hidden");$("hostInfo").classList.add("hidden");$("modeBadge").textContent="연결 대기"}
$("aiBtn").onclick=startAI;$("newGame").onclick=cleanup;
$("hostBtn").onclick=()=>{cleanup();mode="online";isHost=true;localIndex=0;if(!window.Peer){$("netStatus").textContent="PeerJS를 불러오지 못했습니다.";return}$("netStatus").textContent="방을 만드는 중...";peer=new Peer(undefined,{debug:1});peer.on("open",id=>{$("myCode").textContent=id;$("hostInfo").classList.remove("hidden");$("netStatus").textContent="친구에게 방 코드를 보내세요."});peer.on("connection",c=>{if(conn){c.close();return}conn=c;conn.on("open",()=>{state=freshState(["나","친구"]);$("netStatus").textContent="친구와 연결되었습니다!";$("modeBadge").textContent="온라인 대전";conn.send({type:"welcome",state:guestView()});render()});conn.on("data",m=>{if(m.type==="action")processAction(1,m.action)});conn.on("close",()=>$ ("netStatus").textContent="상대와 연결이 끊겼습니다.")});peer.on("error",e=>$ ("netStatus").textContent="연결 오류: "+e.type)};
$("joinBtn").onclick=()=>{let code=$("peerCode").value.trim();if(!code){$("netStatus").textContent="방 코드를 입력하세요.";return}cleanup();mode="online";isHost=false;localIndex=1;if(!window.Peer){$("netStatus").textContent="PeerJS를 불러오지 못했습니다.";return}$("netStatus").textContent="방에 연결하는 중...";peer=new Peer(undefined,{debug:1});peer.on("open",()=>{conn=peer.connect(code,{reliable:true});conn.on("open",()=>{$("netStatus").textContent="연결되었습니다. 게임 정보를 기다리는 중..."});conn.on("data",m=>{if(m.type==="welcome"){state=m.state;$("modeBadge").textContent="온라인 대전";render()}else if(m.type==="state"){state=m.state;render()}});conn.on("close",()=>$ ("netStatus").textContent="호스트와 연결이 끊겼습니다.")});peer.on("error",e=>$ ("netStatus").textContent="연결 오류: "+e.type)};
$("copyCode").onclick=()=>{navigator.clipboard?.writeText($("myCode").textContent).then(()=>$("netStatus").textContent="방 코드를 복사했습니다.").catch(()=>$("netStatus").textContent="코드를 직접 복사해 주세요.")};
})();
